site_name: FreeTheAI Stock Widgets
site_description: Free stock price cards, SVG charts, news feeds, and share images from FreeTheAI Stocks. Embed live prices in any HTML page, WordPress, Ghost, React, or Vue, with no key and no sign-up.
site_url: https://free-the-ai.github.io/free-stock-widgets/
site_author: FreeTheAI
repo_url: https://github.com/Free-The-Ai/free-stock-widgets
repo_name: Free-The-Ai/free-stock-widgets
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 FreeTheAI. MIT licensed.

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Host Grotesk
    code: Azeret Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle: { icon: material/weather-sunny, name: Light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle: { icon: material/weather-night, name: Dark mode }
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

nav:
  - Overview: index.md
  - Live price cards: live-price-card.md
  - Chart images: chart-images.md
  - News feeds: news-feeds.md
  - Languages: languages.md
  - Share images: share-images.md
  - For AI agents: for-ai-agents.md
  - Usage: usage.md
  - Examples: examples.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Free-The-Ai
    - icon: fontawesome/brands/discord
      link: https://discord.gg/secrets
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/ImVibhek
    - icon: material/web
      link: https://freetheai.org
  generator: false
